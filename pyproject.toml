[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield"
version = "0.1.0"
description = "Privacy-first scam triage for Bangladesh"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "openai",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "python-multipart",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["bandit", "mypy", "pip-audit", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["scamshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
