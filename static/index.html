<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>ScamShield | Global scam triage</title>
  <style>
    :root{--bg:#f7f8fb;--card:#fff;--ink:#17202a;--muted:#697586;--line:#e4e8ee;--accent:#5d5fef;--accent-soft:#eeefff;--danger:#d64b57;--danger-soft:#fff0f1;--warn:#b57a12;--warn-soft:#fff8e9;--safe:#1f8a63;--safe-soft:#eaf8f1;--shadow:0 18px 48px #1f29370d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#eef0ff 0,transparent 32rem),var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:880px;margin:auto;padding:30px 20px 72px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:32px}
    .eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:750;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
    h1{font-size:clamp(2rem,6vw,3.35rem);letter-spacing:-.055em;line-height:1;margin:16px 0 12px}.lead{max-width:590px;color:var(--muted);font-size:1.04rem;margin:0}
    button,.drop,textarea{font:inherit}button{border:0;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}button:hover:not(:disabled){transform:translateY(-1px)}button:focus-visible,textarea:focus-visible,.drop:focus-visible{outline:3px solid #b9bbff;outline-offset:3px}
    .lang{background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 14px;white-space:nowrap;box-shadow:var(--shadow);font:inherit}.custom-language{display:none;margin-top:8px;width:100%;max-width:230px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);font:inherit}.custom-language.visible{display:block}
    .composer,.result-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.composer{padding:22px}
    .label-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.label{font-weight:750}.count{color:var(--muted);font-size:.8rem}
    textarea{width:100%;min-height:174px;display:block;resize:vertical;border:1px solid var(--line);border-radius:16px;padding:17px;background:#fbfcfe;color:var(--ink);font-size:1rem;transition:border-color .2s,box-shadow .2s}textarea:focus{border-color:#999cff;box-shadow:0 0 0 4px var(--accent-soft);outline:0}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.drop{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border:1px dashed #cbd1dc;border-radius:12px;color:var(--muted);cursor:pointer;transition:.2s}.drop:hover,.drop.drag{background:var(--accent-soft);border-color:#989bff;color:var(--accent)}.drop input{display:none}
    .primary{min-height:44px;margin-left:auto;border-radius:12px;padding:10px 20px;background:var(--ink);color:#fff;font-weight:750;box-shadow:0 8px 18px #17202a1c}.primary:disabled{opacity:.55;cursor:wait}.sample-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:18px}.sample-row span{color:var(--muted);font-size:.87rem}.sample{border:1px solid var(--line);border-radius:999px;background:#fff;padding:6px 11px;color:var(--muted);font-size:.83rem}
    .status{min-height:30px;margin:22px 4px 0;color:var(--muted);display:flex;align-items:center;gap:9px}.status.busy:before{content:"";width:13px;height:13px;border:2px solid #dfe1ff;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .events{display:grid;gap:7px;margin:4px 4px 0}.event{animation:rise .3s ease both;color:var(--muted);font-size:.86rem}.event:before{content:"";display:inline-block;width:6px;height:6px;background:#b8bdca;border-radius:50%;margin:0 9px 2px 0}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .result-card{margin-top:22px;padding:24px;animation:rise .45s ease both;border-top:4px solid var(--tone)}.result-card[data-v=scam]{--tone:var(--danger);--soft:var(--danger-soft)}.result-card[data-v=suspicious]{--tone:var(--warn);--soft:var(--warn-soft)}.result-card[data-v=likely_safe]{--tone:var(--safe);--soft:var(--safe-soft)}
    .result-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.verdict-label{color:var(--tone);font-weight:800;font-size:1.2rem}.summary{margin:7px 0 0;color:var(--muted);max-width:580px}.score{text-align:right;color:var(--tone);font-size:2.4rem;line-height:1;font-weight:800;white-space:nowrap}.score small{display:block;color:var(--muted);font-size:.72rem;font-weight:500;margin-top:5px}.bar{height:8px;background:#eef0f3;border-radius:9px;margin:22px 0 24px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--tone);border-radius:inherit;transition:width 1s cubic-bezier(.2,.8,.2,1)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.section{background:var(--soft);border-radius:15px;padding:15px}.section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;color:var(--tone)}.section ul{margin:0;padding-left:18px}.section li+li{margin-top:7px}.transcript{border-left:3px solid var(--tone);padding-left:12px;color:var(--muted)}
    .result-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.copy{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}.privacy{color:var(--muted);font-size:.78rem}details{margin-top:15px;color:var(--muted);font-size:.82rem}pre{white-space:pre-wrap;background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto}
    .error{color:var(--danger)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:680px){main{padding:24px 14px 52px}.top{margin-bottom:24px}.top .lang{margin-top:2px}.composer{padding:16px;border-radius:20px}.actions{display:grid;grid-template-columns:1fr 1fr}.primary{grid-column:1/-1;margin-left:0}.grid{grid-template-columns:1fr}.result-head{display:block}.score{text-align:left;margin-top:18px}.result-card{padding:18px;border-radius:20px}}
  </style>
</head>
<body>
<main>
  <header class="top">
    <div><div class="eyebrow"><span class="dot"></span>ScamShield</div><h1 data-i18n="title">Pause. Check. Stay safe.</h1><p class="lead" data-i18n="lead">A private scam check for suspicious SMS, links, screenshots, and voice clips in any language.</p></div>
    <label><span class="sr-only">Report language</span><select id="language" class="lang" aria-label="Report language">
      <option value="en">English</option><option value="bn">বাংলা</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ur">اردو</option><option value="ne">नेपाली</option><option value="id">Bahasa Indonesia</option><option value="sw">Kiswahili</option><option value="de">Deutsch</option><option value="custom">Other language…</option>
    </select><input id="custom-language" class="custom-language" type="text" maxlength="40" placeholder="Type a language name"></label>
  </header>
  <section class="composer" aria-label="Message analysis">
    <div class="label-row"><label for="text" class="label" data-i18n="messageLabel">Paste the message</label><span id="count" class="count">0 / 20,000</span></div>
    <textarea id="text" maxlength="20000" placeholder="Paste an SMS, WhatsApp message, or suspicious link…" data-i18n-placeholder="placeholder"></textarea>
    <div class="actions">
      <label class="drop" id="drop" tabindex="0"><span>＋</span><span data-i18n="image">Add screenshot</span><input id="img" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <label class="drop"><span>◉</span><span data-i18n="voice">Add WAV voice clip</span><input id="voice" type="file" accept="audio/wav,audio/x-wav"></label>
      <button class="primary" id="go" type="button" data-i18n="check">Check message</button>
    </div>
    <div class="sample-row"><span data-i18n="sample">Try a sample</span><button class="sample" data-s="0">Fake KYC link</button><button class="sample" data-s="1">Prize + PIN</button></div>
  </section>
  <div id="status" class="status" aria-live="polite"></div><div id="events" class="events" aria-live="polite"></div><div id="out"></div>
</main>
<script>
const samples=["bKash: আপনার একাউন্ট ২৪ ঘণ্টার মধ্যে বন্ধ হয়ে যাবে। এখনই KYC আপডেট করুন: http://bkash-kyc-update.xyz/login","Congratulations! You won 50,000 BDT in the Nagad lucky draw. Send your PIN to 01712345678 to claim your prize."];
const copy={en:{title:"Pause. Check. Stay safe.",lead:"A private scam check for suspicious SMS, links, screenshots, and voice clips in any language.",messageLabel:"Paste the message",placeholder:"Paste an SMS, WhatsApp message, or suspicious link…",image:"Add screenshot",voice:"Add WAV voice clip",check:"Check message",sample:"Try a sample"}};
let lang="en",busy=false;const $=s=>document.querySelector(s),el=(t,x)=>Object.assign(document.createElement(t),{textContent:x});
const text=$("#text"),count=$("#count");text.oninput=()=>count.textContent=`${text.value.length.toLocaleString()} / 20,000`;
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{text.value=samples[b.dataset.s];text.dispatchEvent(new Event("input"));text.focus()});
$("#language").onchange=event=>{$("#custom-language").classList.toggle("visible",event.target.value==="custom");lang=event.target.value;document.documentElement.lang=lang};
const drop=$("#drop"),img=$("#img");
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));
drop.addEventListener("drop",e=>{e.preventDefault();const file=e.dataTransfer.files[0];if(file)img.files=e.dataTransfer.files});
function section(title,items){if(!Array.isArray(items)||!items.length)return null;const box=el("div");box.className="section";box.append(el("h2",title));const ul=el("ul");items.forEach(i=>ul.append(el("li",i)));box.append(ul);return box}
function render(v,trace,transcript){const risk=Math.max(0,Math.min(100,Number(v.risk)||0)),box=el("section");box.className="result-card";box.dataset.v=v.verdict;const labels={scam:"Likely a scam",suspicious:"Proceed carefully",likely_safe:"No strong scam signals"};const head=el("div");head.className="result-head";const copyHead=el("div");copyHead.append(el("div",labels[v.verdict]||v.verdict),el("p",v.summary||""));copyHead.firstChild.className="verdict-label";copyHead.lastChild.className="summary";const score=el("div",`${risk}`);score.className="score";score.append(el("small","risk score / 100"));head.append(copyHead,score);const bar=el("div");bar.className="bar";const fill=el("i");bar.append(fill);box.append(head,bar);requestAnimationFrame(()=>fill.style.width=`${risk}%`);if(transcript){const t=el("div");t.className="transcript";t.append(el("strong","Transcript"),el("p",transcript));box.append(t)}const grid=el("div");grid.className="grid";[["Red flags",v.red_flags],["Evidence",v.evidence],["Next steps",v.next_steps]].forEach(([t,i])=>{const s=section(t,i);if(s)grid.append(s)});box.append(grid);const actions=el("div");actions.className="result-actions";const copyBtn=el("button","Copy report");copyBtn.className="copy";copyBtn.onclick=async()=>{await navigator.clipboard?.writeText(`${labels[v.verdict]}\nRisk: ${risk}/100\n${v.summary}\n\nRed flags:\n${(v.red_flags||[]).map(x=>"- "+x).join("\n")}\n\nNext steps:\n${(v.next_steps||[]).map(x=>"- "+x).join("\n")}`);copyBtn.textContent="Copied"};actions.append(el("span","Your message is processed in memory."),copyBtn);actions.firstChild.className="privacy";box.append(actions);const d=el("details");d.append(el("summary",`Investigation details (${trace.length} events)`),el("pre",JSON.stringify(trace,null,2)));$("#out").replaceChildren(box,d)}
function showEvent(e){if(e.type==="tool_call")return `Checking ${e.tool.replaceAll("_"," ")}…`;if(e.type==="tool_result")return `${e.tool.replaceAll("_"," ")} complete`;if(e.type==="status")return "Polishing the report…";return ""}
async function check(){if(busy)return;busy=true;const btn=$("#go"),status=$("#status"),events=$("#events"),out=$("#out");btn.disabled=true;status.className="status busy";status.textContent="Investigating message signals…";events.replaceChildren();out.replaceChildren();const fd=new FormData();fd.append("text",text.value);const selected=$("#language").value;fd.append("language",selected==="custom"?$("#custom-language").value.trim():selected);if(img.files[0])fd.append("image",img.files[0]);const voice=$("#voice").files[0];try{if(voice){fd.delete("text");fd.append("audio",voice);const r=await fetch("/api/analyze/voice",{method:"POST",body:fd});if(!r.ok)throw Error(`Server error ${r.status}`);const d=await r.json();render(d.result,d.trace||[],d.transcript);return}const r=await fetch("/api/analyze/stream",{method:"POST",body:fd});if(!r.ok)throw Error(`Server error ${r.status}`);const reader=r.body.getReader(),decoder=new TextDecoder(),trace=[];let buf="",final=null;while(true){const {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const parts=buf.split("\n\n");buf=parts.pop();for(const part of parts){if(!part.startsWith("data: "))continue;const e=JSON.parse(part.slice(6));trace.push(e);const msg=showEvent(e);if(msg)events.append(Object.assign(el("div",msg),{className:"event"}));if(e.type==="verdict")final=e.result}}if(final)render(final,trace);else throw Error("No verdict returned");status.textContent=""}catch(e){status.className="status error";status.textContent=`Could not analyse: ${e.message}`}finally{btn.disabled=false;busy=false}}
$("#go").onclick=check;text.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")check()});
</script>
</body>
</html>
